server.port=${PORT:${SERVER_PORT:8080}}

# Application Details
spring.application.name=smart-healthcare-system

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_healthcare}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# Scheduling & Clinic Configuration
smarthealth.scheduling.slot-duration-minutes=30
smarthealth.scheduling.cancellation-cutoff-hours=2
smarthealth.scheduling.clinic-timezone=UTC

# AI Provider Configuration (RULE_BASED, GEMINI, OPENAI)
smarthealth.ai.provider=${AI_PROVIDER:RULE_BASED}
smarthealth.ai.gemini.api-key=${GEMINI_API_KEY:}
smarthealth.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
smarthealth.ai.openai.api-key=${OPENAI_API_KEY:}
smarthealth.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Actuator & Swagger
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
